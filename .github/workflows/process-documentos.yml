name: Processar documentos

# Cron corrigido: "*/59 * * * *" NAO significa "a cada 59 minutos" -- significa
# "nos minutos 0 e 59 de cada hora", duas execucoes coladas e 59 minutos de
# silencio. O correto para de hora em hora e "0 * * * *".
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # de hora em hora, no minuto 0

# Duas execucoes simultaneas disputariam os mesmos arquivos do Drive e as
# mesmas mensagens do WhatsApp (o agendamento e um disparo manual podem se
# sobrepor).
concurrency:
  group: processar-documentos
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências de sistema (PDF)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      # ---- FONTE 1: WhatsApp (nativo do Odoo) -------------------------------
      # Documentos que chegaram pelo WhatsApp já sabem de qual contato vieram.
      # O coletor traz o arquivo e o contexto junto, para que a gravação não
      # precise adivinhar o dono por CPF.
      - name: Coletar documentos recebidos pelo WhatsApp
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_EMAIL: ${{ secrets.ODOO_EMAIL }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python coletar_whatsapp.py

      # ---- FONTE 2: digitalização / Drive -----------------------------------
      # A única fonte genuinamente anônima: não há contexto de origem.
      - name: Baixar documentos novos do Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python baixar_do_drive.py

      - name: Classificar e extrair documentos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python process_document.py

      # Grava o que deu para gravar sozinho e põe o resto na fila de
      # confirmação dentro do Odoo (menu "Documentos pendentes").
      - name: Gravar no Odoo e enfileirar o que precisa de confirmação
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_EMAIL: ${{ secrets.ODOO_EMAIL }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python write_to_odoo.py

      # O artefato agora é só para diagnóstico de uma execução específica --
      # não é mais a fila de trabalho. A fila de verdade vive no Odoo e não
      # expira em 7 dias.
      - name: Publicar resultados como artefato (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-processamento
          path: |
            arquivos/
            processados/
            revisao_manual/
          if-no-files-found: ignore
          retention-days: 7

      - name: Marcar no Drive só o que foi concluído (roda mesmo se algo falhou)
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python marcar_drive_concluido.py
